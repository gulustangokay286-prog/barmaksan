# Sunucuda: /opt/barmaksan/app/deploy içinde `docker compose up -d --build`
# Diğer projelerden ayrık: kendi ağı, yalnızca 127.0.0.1:8096, veri /opt/barmaksan/data.
name: barmaksan

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: barmaksan-api:latest
    container_name: barmaksan_api
    restart: unless-stopped
    env_file: /opt/barmaksan/.env
    environment:
      DATA_DIR: /data
    volumes:
      - /opt/barmaksan/data:/data
    ports:
      - "127.0.0.1:8096:3000"
    networks:
      - barmaksan_net
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  barmaksan_net:
    name: barmaksan_net
